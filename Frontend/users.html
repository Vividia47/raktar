<!DOCTYPE html>

<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Felhasználók - Raktárkezelő</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

<link rel="stylesheet" href="css/style.css">

</head>

<body class="bg-light">

<div class="container py-4">

    <div class="page-header d-flex justify-content-between align-items-center mb-4">

        <div>
            <h1>Felhasználók</h1>
            <p class="text-muted mb-0">
                A rendszer felhasználói
            </p>
        </div>

        <div class="page-header-actions d-flex">
        <button
            id="back-button"
            class="btn btn-outline-secondary">
            Vissza
        </button>
        </div>

    </div>

    <div class="card shadow-sm">

        <div class="card-body">

            <div class="d-flex justify-content-between align-items-center mb-3">

                <h2 class="h4 mb-0">
                    Felhasználólista
                </h2>

                <button
    id="add-user-button"
    class="btn btn-primary"
    data-bs-toggle="modal"
    data-bs-target="#add-user-modal">
    + Új felhasználó
</button>

            </div>

            <div class="row g-2 mb-3">

    <div class="col-md-8">

        <label class="form-label">
            Keresés
        </label>

        <input
            type="text"
            id="user-search"
            class="form-control"
            placeholder="Felhasználónév vagy teljes név">

    </div>


    <div class="col-md-4">

        <label class="form-label">
            Szerepkör
        </label>

        <select
            id="user-role-filter"
            class="form-select">

            <option value="">
                Mind
            </option>

            <option value="1">
                Raktárvezető
            </option>

            <option value="2">
                Raktáros
            </option>

            <option value="3">
                Kereskedő
            </option>

            <option value="4">
                Anyagbeszerző
            </option>

        </select>

    </div>

</div>

            <div class="table-responsive">

                <table class="table table-striped table-hover align-middle">

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Felhasználónév</th>
                            <th>Teljes név</th>
                            <th>Szerepkör</th>
                            <th>Műveletek</th>
                        </tr>
                    </thead>

                    <tbody id="users-table-body">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<div class="modal fade" id="add-user-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Új felhasználó</h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Bezárás">
                </button>
            </div>

            <div class="modal-body">

                <div class="mb-3">
                    <label for="add-user-name" class="form-label">
                        Felhasználónév
                    </label>

                    <input
                        type="text"
                        id="add-user-name"
                        class="form-control">
                </div>

                <div class="mb-3">
                    <label for="add-user-full-name" class="form-label">
                        Teljes név
                    </label>

                    <input
                        type="text"
                        id="add-user-full-name"
                        class="form-control">
                </div>

                <div class="mb-3">
                    <label for="add-user-password" class="form-label">
                        Jelszó
                    </label>

                    <input
                        type="password"
                        id="add-user-password"
                        class="form-control">
                </div>

                <div class="mb-3">
                    <label for="add-user-rank" class="form-label">
                        Szerepkör
                    </label>

                    <select id="add-user-rank" class="form-select">
                        <option value="1">Raktárvezető</option>
                        <option value="2">Raktáros</option>
                        <option value="3">Kereskedő</option>
                        <option value="4">Anyagbeszerző</option>
                    </select>
                </div>

            </div>

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">
                    Mégse
                </button>

                <button
                    type="button"
                    id="save-user-button"
                    class="btn btn-primary">
                    Mentés
                </button>

            </div>

        </div>
    </div>
</div>

<div class="modal fade" id="edit-user-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Felhasználó szerkesztése</h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Bezárás">
                </button>
            </div>

            <div class="modal-body">

                <div class="mb-3">
                    <label for="edit-user-name" class="form-label">
                        Felhasználónév
                    </label>

                    <input
                        type="text"
                        id="edit-user-name"
                        class="form-control">
                </div>

                <div class="mb-3">
                    <label for="edit-user-full-name" class="form-label">
                        Teljes név
                    </label>

                    <input
                        type="text"
                        id="edit-user-full-name"
                        class="form-control">
                </div>

                <div class="mb-3">
                    <label for="edit-user-rank" class="form-label">
                        Szerepkör
                    </label>

                    <select id="edit-user-rank" class="form-select">
                        <option value="1">Raktárvezető</option>
                        <option value="2">Raktáros</option>
                        <option value="3">Kereskedő</option>
                        <option value="4">Anyagbeszerző</option>
                    </select>
                </div>

            </div>

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">
                    Mégse
                </button>

                <button
                    type="button"
                    id="save-edit-user-button"
                    class="btn btn-primary">
                    Mentés
                </button>

            </div>

        </div>
    </div>
</div>

<!-- Jelszó módosítása modal -->
<div class="modal fade" id="change-user-password-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Jelszó módosítása</h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Bezárás">
                </button>
            </div>

            <div class="modal-body">

                <div class="mb-3">
                    <label for="change-user-password" class="form-label">
                        Új jelszó
                    </label>

                    <input
                        type="password"
                        id="change-user-password"
                        class="form-control">
                </div>

                <div class="mb-3">
                    <label for="change-user-password-confirm" class="form-label">
                        Új jelszó ismét
                    </label>

                    <input
                        type="password"
                        id="change-user-password-confirm"
                        class="form-control">
                </div>

            </div>

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">
                    Mégse
                </button>

                <button
                    type="button"
                    id="save-user-password-button"
                    class="btn btn-primary">
                    Mentés
                </button>

            </div>

        </div>
    </div>
</div>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="js/api.js"></script>

<script>
    requireLogin();

    if (!hasRole(1)) {
        window.location.href = "index.html";
    }
</script>

<script src="js/users.js"></script>

</body>
</html>
