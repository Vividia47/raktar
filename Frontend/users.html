<!DOCTYPE html>

<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Felhasználók - Raktárkezelő</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
>

<link rel="stylesheet" href="css/style.css">

</head>

<body class="bg-light inner-page">

<div class="container py-4">

    <div class="page-header d-flex justify-content-between align-items-center mb-4">

        <div>
            <h1>Felhasználók</h1>
            <p class="text-muted mb-0">
                A rendszer felhasználói
            </p>
        </div>

        <div class="page-header-actions back-page-actions d-flex">
        <button
            id="back-button"
            class="btn btn-outline-secondary back-button"
            aria-label="Vissza"
            title="Vissza">
            <i class="bi bi-arrow-return-left" aria-hidden="true"></i>
            <span class="back-label">Vissza</span>
        </button>
        </div>

    </div>

    <div class="card shadow-sm">

        <div class="card-body">

            <div class="d-flex justify-content-between align-items-center mb-3">

                <button
    id="add-user-button"
    class="btn btn-primary"
    data-bs-toggle="modal"
    data-bs-target="#add-user-modal">
    <i class="bi bi-plus" aria-hidden="true"></i>
    Új felhasználó
</button>

            </div>

            <div class="row g-2 mb-3">

    <div class="col-md-8">

        <label for="user-search" class="form-label">
            Keresés
        </label>

        <div class="input-group">
            <span class="input-group-text search-icon" aria-hidden="true">
                <i class="bi bi-search"></i>
            </span>
            <input
                type="text"
                id="user-search"
                class="form-control"
                placeholder="Felhasználónév, teljes név...">
        </div>

    </div>


    <div class="col-md-4">

        <label for="user-role-filter" class="form-label">
            Szerepkör
        </label>

        <select
            id="user-role-filter"
            class="form-select">

            <option value="">
                Mind
            </option>

            <option value="1">
                Raktárvezető
            </option>

            <option value="2">
                Raktáros
            </option>

            <option value="3">
                Kereskedő
            </option>

            <option value="4">
                Anyagbeszerző
            </option>

        </select>

    </div>

</div>

            <div class="mb-3">
                <button
                    id="user-clear-filters"
                    type="button"
                    class="btn btn-outline-secondary">
                    <i class="bi bi-funnel me-1" aria-hidden="true"></i>
                    Szűrők törlése
                </button>
            </div>

            <div id="user-result-count" class="text-muted mb-2">
                0 találat
            </div>

            <div class="table-responsive">

                <table class="table table-striped table-hover align-middle mobile-card-table users-table">

                    <caption class="visually-hidden">
                        A rendszer felhasználóinak listája
                    </caption>

                    <thead>
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Felhasználónév</th>
                            <th scope="col">Teljes név</th>
                            <th scope="col">Szerepkör</th>
                            <th scope="col" class="text-end">Műveletek</th>
                        </tr>
                    </thead>

                    <tbody id="users-table-body">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<div class="modal fade" id="add-user-modal" tabindex="-1" aria-hidden="true" aria-labelledby="add-user-modal-title">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 id="add-user-modal-title" class="modal-title">Új felhasználó</h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Bezárás">
                </button>
            </div>

            <form id="add-user-form">

            <div class="modal-body">

                <div class="mb-3">
                    <label for="add-user-name" class="form-label">
                        Felhasználónév
                    </label>

                    <input
                        type="text"
                        id="add-user-name"
                        class="form-control"
                        autocomplete="username"
                        required>
                </div>

                <div class="mb-3">
                    <label for="add-user-full-name" class="form-label">
                        Teljes név
                    </label>

                    <input
                        type="text"
                        id="add-user-full-name"
                        class="form-control"
                        autocomplete="name"
                        required>
                </div>

                <div class="mb-3">
                    <label for="add-user-password" class="form-label">
                        Jelszó
                    </label>

                    <div class="input-group">
                        <input
                            type="password"
                            id="add-user-password"
                            class="form-control"
                            autocomplete="new-password"
                            required>
                        <button
                            type="button"
                            class="btn btn-outline-secondary password-toggle"
                            data-password-target="add-user-password"
                            aria-label="Jelszó megjelenítése">
                            <i class="bi bi-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="add-user-rank" class="form-label">
                        Szerepkör
                    </label>

                    <select id="add-user-rank" class="form-select">
                        <option value="1">Raktárvezető</option>
                        <option value="2">Raktáros</option>
                        <option value="3">Kereskedő</option>
                        <option value="4">Anyagbeszerző</option>
                    </select>
                </div>

            </div>

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">
                    Mégse
                </button>

                <button
                    type="submit"
                    id="save-user-button"
                    class="btn btn-primary">
                    Mentés
                </button>

            </div>

            </form>

        </div>
    </div>
</div>

<div class="modal fade" id="edit-user-modal" tabindex="-1" aria-hidden="true" aria-labelledby="edit-user-modal-title">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 id="edit-user-modal-title" class="modal-title">Felhasználó szerkesztése</h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Bezárás">
                </button>
            </div>

            <form id="edit-user-form">

            <div class="modal-body">

                <div class="mb-3">
                    <label for="edit-user-name" class="form-label">
                        Felhasználónév
                    </label>

                    <input
                        type="text"
                        id="edit-user-name"
                        class="form-control"
                        autocomplete="username"
                        required>
                </div>

                <div class="mb-3">
                    <label for="edit-user-full-name" class="form-label">
                        Teljes név
                    </label>

                    <input
                        type="text"
                        id="edit-user-full-name"
                        class="form-control"
                        autocomplete="name"
                        required>
                </div>

                <div class="mb-3">
                    <label for="edit-user-rank" class="form-label">
                        Szerepkör
                    </label>

                    <select id="edit-user-rank" class="form-select">
                        <option value="1">Raktárvezető</option>
                        <option value="2">Raktáros</option>
                        <option value="3">Kereskedő</option>
                        <option value="4">Anyagbeszerző</option>
                    </select>
                </div>

            </div>

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">
                    Mégse
                </button>

                <button
                    type="submit"
                    id="save-edit-user-button"
                    class="btn btn-primary">
                    Mentés
                </button>

            </div>

            </form>

        </div>
    </div>
</div>

<!-- Jelszó módosítása modal -->
<div class="modal fade" id="change-user-password-modal" tabindex="-1" aria-hidden="true" aria-labelledby="change-user-password-modal-title">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 id="change-user-password-modal-title" class="modal-title">Jelszó módosítása</h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Bezárás">
                </button>
            </div>

            <form id="change-user-password-form">

            <div class="modal-body">

                <div class="mb-3">
                    <label for="change-user-password" class="form-label">
                        Új jelszó
                    </label>

                    <div class="input-group">
                        <input
                            type="password"
                            id="change-user-password"
                            class="form-control"
                            autocomplete="new-password"
                            required>
                        <button
                            type="button"
                            class="btn btn-outline-secondary password-toggle"
                            data-password-target="change-user-password"
                            aria-label="Jelszó megjelenítése">
                            <i class="bi bi-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="change-user-password-confirm" class="form-label">
                        Új jelszó ismét
                    </label>

                    <div class="input-group">
                        <input
                            type="password"
                            id="change-user-password-confirm"
                            class="form-control"
                            autocomplete="new-password"
                            required>
                        <button
                            type="button"
                            class="btn btn-outline-secondary password-toggle"
                            data-password-target="change-user-password-confirm"
                            aria-label="Jelszó megjelenítése">
                            <i class="bi bi-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

            </div>

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">
                    Mégse
                </button>

                <button
                    type="submit"
                    id="save-user-password-button"
                    class="btn btn-primary">
                    Mentés
                </button>

            </div>

            </form>

        </div>
    </div>
</div>

<div
    class="modal fade"
    id="delete-user-modal"
    tabindex="-1"
    aria-hidden="true"
    aria-labelledby="delete-user-modal-title">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="delete-user-modal-title" class="modal-title h5">
                    Felhasználó törlése
                </h2>
                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Bezárás">
                </button>
            </div>
            <div class="modal-body">
                <p class="mb-2">Biztosan törölni szeretné ezt a felhasználót?</p>
                <p class="fw-semibold mb-0" id="delete-user-name"></p>
            </div>
            <div class="modal-footer">
                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">
                    Mégse
                </button>
                <button
                    type="button"
                    id="confirm-delete-user-button"
                    class="btn btn-danger">
                    <i class="bi bi-trash" aria-hidden="true"></i>
                    Törlés
                </button>
            </div>
        </div>
    </div>
</div>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="js/api.js"></script>

<script>
    requireLogin();

    if (!hasRole(1)) {
        window.location.href = "index.html";
    }
</script>

<script src="js/users.js"></script>

</body>
</html>
