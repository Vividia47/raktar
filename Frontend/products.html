<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Termékek - Raktárkezelő</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

    <div class="container py-4">

        <div class="page-header d-flex justify-content-between align-items-center mb-4">

            <div>
                <h1>Termékek</h1>
                <p class="text-muted mb-0">
                    A raktárban található termékek
                </p>
            </div>

            <div class="page-header-actions d-flex">
            <button
                id="back-button"
                class="btn btn-outline-secondary">
                Vissza
            </button>
            </div>

        </div>

        <div class="card shadow-sm">

            <div class="card-body">

                

                <div class="d-flex justify-content-between align-items-center mb-3">

                    <h2 class="h4 mb-0">
                        Terméklista
                    </h2>

                    <button
    id="add-product-button"
    class="btn btn-primary"
    data-bs-toggle="modal"
    data-bs-target="#add-product-modal">
    + Új termék
</button>

                </div>

                <div class="row g-2 mb-3">

    <div class="col-md-5">
        <label for="product-search" class="form-label">
            Keresés
        </label>

        <input
            type="text"
            id="product-search"
            class="form-control"
            placeholder="Név, cikkszám, vonalkód..."
        >
    </div>


    <div class="col-md-3">
        <label for="product-stock-filter" class="form-label">
            Készlet
        </label>

        <select
            id="product-stock-filter"
            class="form-select">

            <option value="">
                Mind
            </option>

            <option value="low">
                Alacsony készlet
            </option>

            <option value="ok">
                Megfelelő készlet
            </option>

        </select>
    </div>


    <div class="col-md-4">
        <label for="product-sort" class="form-label">
            Rendezés
        </label>

        <select
            id="product-sort"
            class="form-select">

            <option value="default">
                Alapértelmezett
            </option>

            <option value="name-asc">
                Név szerint A-Z
            </option>

            <option value="name-desc">
                Név szerint Z-A
            </option>

            <option value="price-asc">
                Eladási ár szerint növekvő
            </option>

            <option value="price-desc">
                Eladási ár szerint csökkenő
            </option>

        </select>
    </div>

</div>


<div class="mb-3">

    <button
        id="product-clear-filters"
        class="btn btn-outline-secondary">

        Szűrők törlése

    </button>

</div>


<div id="product-result-count" class="text-muted mb-2">
    0 találat
</div>

                <div class="table-responsive">

                    <table class="table table-striped table-hover align-middle">

                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Cikkszám</th>
                                <th>Vonalkód</th>
                                <th>Megnevezés</th>
                                <th>ÁFA</th>
                                <th>Beszerzési ár</th>
                                <th>Eladási ár</th>
                                <th>Készlet</th>
<th>Min. készlet</th>
<th>Rendelendő mennyiség</th>
                                <th>Egység</th>
                                <th>Polc</th>
                                <th>Gyűjtő</th>
                                <th>Gyűjtő egység</th>
                                <th class="text-end"></th>
                            </tr>
                        </thead>

                        <tbody id="products-table-body">

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

    <!-- ÚJ TERMÉK MODAL -->
<div
    class="modal fade"
    id="add-product-modal"
    tabindex="-1"
    aria-hidden="true">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header">
                <h2 class="modal-title">
                    Új termék
                </h2>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Bezárás">
                </button>
            </div>

            <div class="modal-body">

                <form id="add-product-form">

    <div class="row g-3">

        <div class="col-md-6">
            <label for="product-article" class="form-label">
                Cikkszám
            </label>
            <input
                type="text"
                class="form-control"
                id="product-article"
                maxlength="20"
                required>
        </div>

        <div class="col-md-6">
            <label for="product-barcode" class="form-label">
                Vonalkód
            </label>
            <input
                type="text"
                class="form-control"
                id="product-barcode"
                maxlength="13"
                required>
        </div>

        <div class="col-12">
            <label for="product-name" class="form-label">
                Megnevezés
            </label>
            <input
                type="text"
                class="form-control"
                id="product-name"
                maxlength="100"
                required>
        </div>

        <div class="col-md-4">
            <label for="product-vat" class="form-label">
                ÁFA (%)
            </label>
            <input
                type="number"
                class="form-control"
                id="product-vat"
                min="0"
                step="0.01"
                required>
        </div>

        <div class="col-md-4">
            <label for="product-sprice" class="form-label">
                Eladási ár
            </label>
            <input
                type="number"
                class="form-control"
                id="product-sprice"
                min="0"
                step="0.01"
                required>
        </div>

        <div class="col-md-4">
            <label for="product-min-stock" class="form-label">
                Minimum készlet
            </label>
            <input
                type="number"
                class="form-control"
                id="product-min-stock"
                min="0"
                step="0.01"
                required>
        </div>

        <div class="col-md-6">
            <label for="product-unit" class="form-label">
                Egység
            </label>
            <input
                type="text"
                class="form-control"
                id="product-unit"
                maxlength="20"
                required>
        </div>

        <div class="col-md-6">
            <label for="product-shelf" class="form-label">
                Polc
            </label>
            <input
                type="text"
                class="form-control"
                id="product-shelf"
                maxlength="20">
        </div>

        <div class="col-md-6">
            <label for="product-bundle" class="form-label">
                Gyűjtő
            </label>
            <input
                type="number"
                class="form-control"
                id="product-bundle"
                min="0"
                step="0.01">
        </div>

        <div class="col-md-6">
            <label for="product-bunit" class="form-label">
                Gyűjtő egység
            </label>
            <input
                type="text"
                class="form-control"
                id="product-bunit"
                maxlength="20">
        </div>

    </div>

</form>

            </div>

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">
                    Mégse
                </button>

                <button
    type="submit"
    form="add-product-form"
    class="btn btn-primary">
    Mentés
</button>

            </div>

        </div>

    </div>

</div>

<div
    class="modal fade"
    id="edit-product-modal"
    tabindex="-1"
    aria-hidden="true">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header">
                <h2 class="modal-title">
                    Termék szerkesztése
                </h2>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Bezárás">
                </button>
            </div>

            <div class="modal-body">

                <form id="edit-product-form">

                    <div class="row g-3">

                        <div class="col-md-6">
                            <label for="edit-product-article" class="form-label">
                                Cikkszám
                            </label>
                            <input
                                type="text"
                                class="form-control"
                                id="edit-product-article"
                                maxlength="20"
                                required>
                        </div>

                        <div class="col-md-6">
                            <label for="edit-product-barcode" class="form-label">
                                Vonalkód
                            </label>
                            <input
                                type="text"
                                class="form-control"
                                id="edit-product-barcode"
                                maxlength="13"
                                required>
                        </div>

                        <div class="col-12">
                            <label for="edit-product-name" class="form-label">
                                Megnevezés
                            </label>
                            <input
                                type="text"
                                class="form-control"
                                id="edit-product-name"
                                maxlength="100"
                                required>
                        </div>

                        <div class="col-md-4">
                            <label for="edit-product-vat" class="form-label">
                                ÁFA (%)
                            </label>
                            <input
                                type="number"
                                class="form-control"
                                id="edit-product-vat"
                                min="0"
                                step="0.01"
                                required>
                        </div>

                        <div class="mb-3">
    <label for="edit-product-sprice" class="form-label">
        Eladási ár
    </label>

    <input
        type="number"
        id="edit-product-sprice"
        class="form-control"
        min="0"
        step="0.01">
</div>

                        <div class="col-md-4">
                            <label for="edit-product-min-stock" class="form-label">
                                Minimum készlet
                            </label>
                            <input
                                type="number"
                                class="form-control"
                                id="edit-product-min-stock"
                                min="0"
                                step="0.01"
                                required>
                        </div>

                        <div class="col-md-4">
                            <label for="edit-product-unit" class="form-label">
                                Egység
                            </label>
                            <input
                                type="text"
                                class="form-control"
                                id="edit-product-unit"
                                maxlength="20"
                                required>
                        </div>

                        <div class="col-md-6">
                            <label for="edit-product-shelf" class="form-label">
                                Polc
                            </label>
                            <input
                                type="text"
                                class="form-control"
                                id="edit-product-shelf"
                                maxlength="20">
                        </div>

                        <div class="col-md-6">
                            <label for="edit-product-bundle" class="form-label">
                                Gyűjtő
                            </label>
                            <input
                                type="number"
                                class="form-control"
                                id="edit-product-bundle"
                                min="0"
                                step="0.01">
                        </div>

                        <div class="col-md-6">
                            <label for="edit-product-bunit" class="form-label">
                                Gyűjtő egység
                            </label>
                            <input
                                type="text"
                                class="form-control"
                                id="edit-product-bunit"
                                maxlength="20">
                        </div>

                    </div>

                </form>

            </div>

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">
                    Mégse
                </button>

                <button
                    type="submit"
                    form="edit-product-form"
                    class="btn btn-primary">
                    Mentés
                </button>

            </div>

        </div>

    </div>

</div>

    <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="js/api.js"></script>
<script>
    requireLogin();
</script>
<script src="js/products.js"></script>

</body>
</html>
