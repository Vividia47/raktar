<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Készletmozgások - Raktárkezelő</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

    <div class="container py-4">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>
                <h1>Előzmények</h1>
                <p class="text-muted mb-0">
                    A raktár készletmozgásainak története
                </p>
            </div>

            <button
                id="back-button"
                class="btn btn-outline-secondary">
                Vissza
            </button>

        </div>

        <div class="card shadow-sm">

            <div class="card-body">

                <div class="row g-2 mb-3">

                    <div class="col-md-4">
                        <label for="history-search" class="form-label">
                            Keresés
                        </label>
                        <input
                            type="text"
                            id="history-search"
                            class="form-control"
                            placeholder="Termék, felhasználó, bizonylatszám..."
                        >
                    </div>

                    <div class="col-md-2">
                        <label for="history-product-filter" class="form-label">
                            Termék
                        </label>
                        <select
                            id="history-product-filter"
                            class="form-select">
                            <option value="">Mind</option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <label for="history-user-filter" class="form-label">
                            Felhasználó
                        </label>
                        <select
                            id="history-user-filter"
                            class="form-select">
                            <option value="">Mind</option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <label for="history-movement-filter" class="form-label">
                            Mozgás típusa
                        </label>
                        <select
                            id="history-movement-filter"
                            class="form-select">
                            <option value="">Mind</option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <label for="history-sort" class="form-label">
                            Rendezés
                        </label>
                        <select
                            id="history-sort"
                            class="form-select">
                            <option value="newest">Legújabb elöl</option>
                            <option value="oldest">Legrégebbi elöl</option>
                        </select>
                    </div>

                </div>

                <div class="mb-3">
                    <button
                        id="history-clear-filters"
                        class="btn btn-outline-secondary">
                        Szűrők törlése
                    </button>
                </div>

                <div id="history-result-count" class="text-muted mb-2">
    0 találat
</div>

<div class="table-responsive">

                    <table class="table table-striped table-hover align-middle">

                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Termék</th>
                                <th>Felhasználó</th>
                                <th>Dátum</th>
                                <th>Bizonylatszám</th>
                                <th>Mennyiség</th>
                                <th>Mozgás típusa</th>
                                <th>Beszerzési ár</th>
                                <th>Eladási ár</th>
                                <th>Sorozatszám</th>
                            </tr>
                        </thead>

                        <tbody id="history-table-body">
                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

    <script src="js/api.js"></script>

    <script>
        requireLogin();
    </script>

    <script src="js/history.js"></script>

</body>
</html>
