<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Készletmozgások - Raktárkezelő</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light inner-page">

    <div class="container py-4">

        <div class="page-header d-flex justify-content-between align-items-center mb-4">

            <div>
                <h1>Előzmények</h1>
                <p class="text-muted mb-0">
                    A raktár készletmozgásainak története
                </p>
            </div>

            <div class="page-header-actions back-page-actions d-flex">
                <button id="back-button" class="btn btn-outline-secondary back-button" aria-label="Vissza"
                    title="Vissza">
                    <i class="bi bi-arrow-return-left" aria-hidden="true"></i>
                    <span class="back-label">Vissza</span>
                </button>
            </div>

        </div>

        <div class="card shadow-sm">

            <div class="card-body">

                <div class="row g-2 mb-3">

                    <div class="col-md-8">
                        <label for="history-search" class="form-label">
                            Keresés
                        </label>
                        <div class="input-group">
                            <span class="input-group-text search-icon" aria-hidden="true">
                                <i class="bi bi-search"></i>
                            </span>
                            <input type="text" id="history-search" class="form-control"
                                placeholder="Termék, felhasználó, bizonylatszám...">
                        </div>
                    </div>

                    <div class="col-md-2">
                        <label for="history-movement-filter" class="form-label">
                            Mozgás típusa
                        </label>
                        <select id="history-movement-filter" class="form-select">
                            <option value="">Mind</option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <label for="history-sort" class="form-label">
                            Rendezés
                        </label>
                        <select id="history-sort" class="form-select">
                            <option value="newest">Legújabb elöl</option>
                            <option value="oldest">Legrégebbi elöl</option>
                        </select>
                    </div>

                </div>

                <div class="mb-3">
                    <button id="history-clear-filters" class="btn btn-outline-secondary">
                        <i class="bi bi-funnel me-1" aria-hidden="true"></i>
                        Szűrők törlése
                    </button>
                </div>

                <div id="history-result-count" class="text-muted mb-2">
                    0 találat
                </div>

                <div class="table-responsive">

                    <table class="table table-striped table-hover align-middle mobile-card-table history-table">

                        <caption class="visually-hidden">
                            A raktár készletmozgásainak története
                        </caption>

                        <thead>
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Termék</th>
                                <th scope="col">Felhasználó</th>
                                <th scope="col">Dátum</th>
                                <th scope="col">Bizonylatszám</th>
                                <th scope="col">Mennyiség</th>
                                <th scope="col">Mozgás típusa</th>
                                <th scope="col">Beszerzési ár</th>
                                <th scope="col">Eladási ár</th>
                                <th scope="col">Sorozatszám</th>
                            </tr>
                        </thead>

                        <tbody id="history-table-body">
                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

    <script src="js/api.js"></script>

    <script>
        requireLogin();
    </script>

    <script src="js/history.js"></script>

</body>

</html>
