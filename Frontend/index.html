<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raktárkezelő - Bejelentkezés</title>
    
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-12 col-sm-8 col-md-6 col-lg-4">

                <div class="card shadow-sm">
                    <div class="card-body p-4">

                        <h1 class="text-center mb-4">
                            Raktárkezelő
                        </h1>

                        <form>
                            <div id="register-section">
    <h2 class="text-center mb-3">Első indítás</h2>
    <p class="text-center text-muted">
        Még nincs felhasználó. Hozd létre a raktárvezetői fiókot.
    </p>

    <form id="register-form">
        <div class="mb-3">
            <label for="register-username" class="form-label">
                Felhasználónév
            </label>
            <input
                type="text"
                class="form-control"
                id="register-username"
                required
            >
        </div>

        <div class="mb-3">
            <label for="register-fullname" class="form-label">
                Teljes név
            </label>
            <input
                type="text"
                class="form-control"
                id="register-fullname"
                required
            >
        </div>

        <div class="mb-3">
            <label for="register-password" class="form-label">
                Jelszó
            </label>
            <input
                type="password"
                class="form-control"
                id="register-password"
                required
            >
        </div>

        <div class="mb-3">
            <label for="register-password-confirm" class="form-label">
                Jelszó megerősítése
            </label>
            <input
                type="password"
                class="form-control"
                id="register-password-confirm"
                required
            >
        </div>

        <button type="submit" class="btn btn-primary w-100">
            Raktárvezető létrehozása
        </button>
    </form>
</div>

<div id="login-section" class="d-none">
    <h2 class="text-center mb-3">Bejelentkezés</h2>

    <form id="login-form">
        <div class="mb-3">
            <label for="username" class="form-label">
                Felhasználónév
            </label>
            <input
                type="text"
                class="form-control"
                id="username"
                required
            >
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">
                Jelszó
            </label>
            <input
                type="password"
                class="form-control"
                id="password"
                required
            >
        </div>

        <button type="submit" class="btn btn-primary w-100">
            Bejelentkezés
        </button>
    </form>
</div>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
    <script src="js/api.js"></script>
    <script src="js/login.js"></script>

</body>
</html>
